name: Build and Deploy Astro

# One workflow, three triggers, one deploy path:
#
#   push to main      — a normal content/code change ships immediately.
#   schedule (hourly) — rebuilds so a scheduled article (publishDate in the
#                       future when it was merged) goes live once it is due,
#                       and /videos picks up new YouTube uploads.
#                       The site is static, so "published" means "the first
#                       build that runs at or after publishDate"
#                       (see src/lib/publication.ts).
#   workflow_dispatch — manual "Run workflow" button (main only, see the job).
#
# Deploy = FTP upload of dist/ into public_html, UPLOAD-ONLY.
# public_html also holds separate platforms that are NOT part of this site
# (coach, dota2, me.english, me.studio, start, go, tathmeer). Hostinger's
# Git auto-deploy replaced the whole folder and deleted them (24 Nov 2026),
# so it is switched off and must stay off. The FTP action below keeps a
# record of the files IT uploaded (.ftp-deploy-sync-state.json on the
# server) and only ever updates or removes those; anything it did not put
# there is never touched. The protected folder names are also excluded
# explicitly as a second guard.
#
# Stale-build protection: every run except a first-attempt push re-checks, just
# before uploading, that the commit it built is still the tip of main, and
# stands down if it is not. A newer commit always has its own push run.
#
# GitHub cron is UTC and best-effort: runs can start several minutes late
# (more under load at the top of the hour, hence minute 17). An article
# scheduled for 10:00 UTC goes live at the first run at or after 10:00 —
# normally ~10:17 UTC, so expect up to ~1 hour of latency, never minute-level
# precision. Local time = UTC + your offset (e.g. UTC+4: 10:17 UTC = 14:17).
# An hourly run with nothing new uploads nothing (the action compares file
# hashes with its record first).
on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Two runs must never upload at the same time.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # A manual run can be started from any branch in the Actions UI; only main may
    # build and deploy. Push and schedule events already run on main.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Astro
        run: npm run build

      # Last line of defence on the site's side: the build must never contain
      # a top-level entry with a protected platform's name, nor host config
      # files that could affect other platforms.
      - name: Refuse to deploy anything that belongs to another platform
        run: |
          bad="$(ls -A dist | grep -iE '^(coach|dota2|me\.english|me\.studio|start|go|tathmeer|\.htaccess|\.user\.ini|php\.ini)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::dist/ contains protected names: $bad. Not deploying."
            exit 1
          fi

      # A scheduled run, a manual run, or a re-run of an old run builds the
      # commit it was started for; if main has moved on since, uploading it
      # would put OLDER content live over the newer deploy. In that case this
      # run stands down. First-attempt push runs are ordered by the
      # concurrency group. If main's tip cannot be read, the step FAILS
      # (visible, emailed) rather than deploying blind or silently skipping.
      - name: Refuse to deploy a build that is no longer the tip of main
        id: fresh
        if: github.event_name != 'push' || github.run_attempt > 1
        run: |
          built="$(git rev-parse HEAD)"
          tip="$(git ls-remote "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)" || tip=""
          if [ -z "$tip" ]; then
            echo "::error::Could not read the tip of main, so this build was not deployed. Re-run the job."
            exit 1
          fi
          if [ "$tip" = "$built" ]; then
            echo "Built ${built:0:7}, which is the tip of main: OK to deploy."
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Built ${built:0:7} but main is now ${tip:0:7}; not deploying this stale build. The run for the newer commit deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # Secrets are set by Milad in GitHub (Settings → Secrets and variables →
      # Actions): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD. The FTP account's
      # home folder is public_html, so server-dir is its root.
      - name: Upload the site to public_html (upload-only)
        if: steps.fresh.outputs.current != 'false'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            coach/**
            dota2/**
            me.english/**
            me.studio/**
            start/**
            go/**
            tathmeer/**
            Tathmeer/**
